<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Yash Kumar Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
}

.container{
    width:380px;
    background:#ffffff;
    border-radius:15px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
    color:#333;
}

input[type=email],
input[type=password]{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#2563eb;
}

.options{
    display:flex;
    justify-content:space-between;
    margin:18px 0;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:17px;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.signup{
    text-align:center;
    margin-top:20px;
}

.signup a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<h1>Welcome Back</h1>

<p>Login to Your Portfolio</p>

<form action="index.html">

<label>Email</label>
<input type="email" placeholder="Enter Email" required>

<label>Password</label>
<input type="password" placeholder="Enter Password" required>

<div class="options">
<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>
</div>

<button type="submit">Login</button>

</form>

<div class="signup">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

<footer>
© 2026 Yash Kumar Portfolio
</footer>

</div>

</body>
</html>
